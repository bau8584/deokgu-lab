<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ▼▼ 앱마다 교체 ▼▼ -->
<title>{{TITLE}} — 덕구랩</title>
<meta name="description" content="{{HOOK}}">
<meta property="og:title" content="{{TITLE}} — 덕구랩">
<meta property="og:description" content="{{HOOK}}">
<meta property="og:image" content="shots/{{OG_IMAGE}}">
<meta property="og:type" content="article">
<!-- ▲▲ 앱마다 교체 ▲▲ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{--cheese:#F2A33C;--cheese-deep:#C77A2C;--cream:#FFF7EC;--paper:#FFFDF8;--ink:#2E2A26;--ink-soft:#7A6A56;--mint:#3CC9A0;--line:#EAD9BE;--pink:#E8938A}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);background:var(--cream);line-height:1.8;-webkit-font-smoothing:antialiased}
  .hand{font-family:'Gaegu',cursive}
  .wrap{max-width:760px;margin:0 auto;padding:0 22px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
  .back{font-family:'Gaegu',cursive;font-size:19px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:var(--cheese-deep)}
  .home-logo{height:44px;width:auto}
  article{padding:8px 0 24px}
  .cat{display:inline-block;font-size:13px;background:#FBEEDA;color:var(--cheese-deep);border-radius:20px;padding:4px 13px;margin-bottom:14px}
  h1{font-family:'Gaegu',cursive;font-weight:700;font-size:clamp(34px,6vw,48px);line-height:1.15;margin-bottom:14px}
  .hook{font-size:20px;color:var(--ink);background:var(--paper);border-left:5px solid var(--mint);border-radius:0 12px 12px 0;padding:14px 18px;margin:18px 0 26px}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px}
  .tag{font-size:12px;padding:4px 11px;border-radius:20px;background:#FBEEDA;color:var(--cheese-deep)}
  .tag.mint{background:#E1F6EF;color:#1c8f6f}
  article h2{font-family:'Gaegu',cursive;font-weight:700;font-size:27px;margin:34px 0 10px;color:var(--ink)}
  article p{margin:12px 0;font-size:16.5px}
  figure{margin:22px 0}
  figure img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(199,122,44,.12)}
  figcaption{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:8px}
  .video{position:relative;aspect-ratio:16/9;margin:22px 0}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:14px}
  .cta{display:block;text-align:center;font-family:'Gaegu',cursive;font-size:22px;background:var(--cheese);color:#fff;text-decoration:none;border-radius:16px;padding:16px;margin:32px 0 10px;box-shadow:0 8px 20px rgba(242,163,60,.35)}
  .cta:hover{background:var(--cheese-deep)}
  .note{font-size:13.5px;color:var(--ink-soft);text-align:center;margin-bottom:8px}
  .foot-actions{display:flex;gap:12px;justify-content:center;align-items:center;margin:30px 0;padding-top:24px;border-top:1px dashed var(--line)}
  .like{font-family:'Gowun Dodum',sans-serif;font-size:15px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:9px 18px;cursor:pointer;display:inline-flex;gap:7px}
  .like:hover{border-color:var(--pink);color:var(--ink)}
  .sign{font-family:'Gaegu',cursive;font-size:18px;color:var(--ink-soft);text-align:center;margin:26px 0 60px}
  /* 좋아요·댓글은 다음 세션에 Supabase 연결. 지금은 자리표시(UI만). */
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../../index.html">← 덕구랩</a>
    <img class="home-logo" src="../../assets/logo.png" alt="덕구랩" onerror="this.style.display='none'">
  </div>
  <article>
    <span class="cat">{{CATEGORY}}</span>
    <h1>{{TITLE}}</h1>
    <div class="hook">{{HOOK}}</div>
    <div class="tags">{{TAGS}}</div>

    <!-- 대표 스크린샷 -->
    <figure><img src="shots/{{HERO}}" alt="{{TITLE}} 화면"><figcaption>{{HERO_CAP}}</figcaption></figure>

    {{BODY}}

    <!-- 데모 영상 있으면 유지, 없으면 이 블록 삭제
    <h2>움직이는 걸 보여드릴게요</h2>
    <div class="video"><iframe src="https://www.youtube.com/embed/{{YOUTUBE_ID}}" allowfullscreen></iframe></div>
    -->

    <a class="cta" href="{{APP_URL}}" target="_blank" rel="noopener">써보러 가기 →</a>
    <p class="note">{{CTA_NOTE}}</p>

    <div class="foot-actions">
      <button class="like" title="도움됐어요">🐾 도움됐어요 <b>0</b></button>
    </div>
    <p class="sign hand">만드는 재미로 사는 초등쌤, 박덕구 🐈</p>
  </article>
</div>
<script src="../../assets/config.js"></script>
<script src="../../assets/api.js"></script>
<script>DeokguPost.init();</script>
</body>
</html>
